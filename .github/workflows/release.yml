name: Release Kglance

on:
  push:
    tags:
      - "v*"

env:
  BINARY: kglance
  APP_ID: kglance
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
            appimg_arch: x86_64
            linuxdeploy_url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            appimg_arch: aarch64
            linuxdeploy_url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
            appimagetool_url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.arch }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: apt-${{ matrix.arch }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            file \
            patchelf \
            ffmpeg

      - name: Install Typst CLI
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.14.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          sharedKey: kglance-release

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Install cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      - name: Cache AppImage tools
        uses: actions/cache@v4
        id: cache-appimage-tools
        with:
          path: |
            .tools/linuxdeploy.AppImage
            .tools/appimagetool.AppImage
          key: appimage-tools-${{ matrix.arch }}-v1

      - name: Download AppImage tools
        if: steps.cache-appimage-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/linuxdeploy.AppImage "${{ matrix.linuxdeploy_url }}"
          curl -fsSL -o .tools/appimagetool.AppImage "${{ matrix.appimagetool_url }}"

      - name: Make AppImage tools executable
        run: chmod +x .tools/linuxdeploy.AppImage .tools/appimagetool.AppImage

      - name: Run tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip "target/release/${BINARY}"

      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME
          cargo deb --no-build --deb-version "${VERSION}-1" \
            -o "${BINARY}_${VERSION}-1_${{ matrix.deb_arch }}.deb"

      - name: Build .rpm package
        run: |
          VERSION="${GITHUB_REF_NAME
          cargo generate-rpm
          mv target/generate-rpm/*.rpm \
            "${BINARY}-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"

      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME
          APPDIR=AppDir
          rm -rf "$APPDIR"

          install -Dm755 "target/release/${BINARY}" "$APPDIR/usr/bin/${BINARY}"
          install -Dm644 "data/${APP_ID}.desktop"     "$APPDIR/usr/share/applications/${APP_ID}.desktop"
          install -Dm644 "data/${APP_ID}.svg"         "$APPDIR/usr/share/icons/hicolor/scalable/apps/${APP_ID}.svg"
          install -Dm644 "data/${APP_ID}-rust.desktop" "$APPDIR/usr/share/kio/servicemenus/${APP_ID}-rust.desktop"

          export VERSION="${VERSION}"
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./.tools/linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/${BINARY}" \
            --desktop-file "data/${APP_ID}.desktop" \
            --icon-file "data/${APP_ID}.svg" \
            --output appimage


          mv "${APP_ID}-${VERSION}-${{ matrix.appimg_arch }}.AppImage" \
             "${BINARY}-${VERSION}-${{ matrix.appimg_arch }}.AppImage" 2>/dev/null \
          || mv ./*.AppImage "${BINARY}-${VERSION}-${{ matrix.appimg_arch }}.AppImage"

      - name: Generate per-artifact checksums
        run: |
          for f in *.deb *.rpm *.AppImage; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
            *.AppImage
            *.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/

      - name: Generate unified SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.deb *.rpm *.AppImage | tee SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
