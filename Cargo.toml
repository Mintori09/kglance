[package]
name = "kglance"
version = "0.1.0"
edition = "2024"

[dependencies]
syntect = { version = "5.3.0", default-features = false, features = [
  "default-onig",
  "default-syntaxes",
  "default-themes",
] }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
] }
kamadak-exif = "0.6.1"
resvg = "0.47"

mupdf = { version = "0.8", default-features = false, features = [
  "img",
  "system-fonts",
  "base14-fonts",
  "brotli",
] }
pulldown-cmark = "0.13.4"
iced_math = "0.5"
zip = "8.6.0"
tar = "0.4.46"
sevenz-rust = { version = "0.6.1", optional = true }
iced = { version = "0.14.0", features = [
  "tokio",
  "image",
  "svg",
  "canvas",
  "highlighter",
  "advanced",
] }
iced_futures = "0.14.0"
iced_aw = { version = "0.14.1", default-features = false, features = ["wrap"] }
iced_video_player = "0.6"
zbus = "5.18.0"
csv = "1.3"
chrono = "0.4.45"
tokio = { version = "1.53.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "process",
] }
tempfile = "3.27.0"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
symphonia = { version = "0.6", default-features = false, features = [
  "mp3",
  "vorbis",
  "flac",
  "wav",
  "aac",
  "isomp4",
  "ogg",
  "mkv",
] }
url = "2"
docx-rs = "0.4"
calamine = "0.36"
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
dirs = "6.0"
lru = "0.13"
md5 = "0.7"


[features]
default = ["7z"]
7z = ["sevenz-rust"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "video_resolution"
harness = false

[[bench]]
name = "startup_bench"
harness = false

[[bin]]
name = "kglance"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = 1
rpath = false
lto = false
incremental = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.release]
lto = "thin"
opt-level = 3
strip = true
# codegen-units = 1
panic = "abort"
