[package]
name = "Kglance"
version = "0.1.0"
edition = "2024"

[dependencies]
syntect = { version = "5", default-features = false, features = ["default-onig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = "0.43"
lopdf = "0.34"
zip = "2"
tar = "0.4"
sevenz-rust = { version = "0.6", optional = true }
slint = "1"
zbus = "5"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
default = ["7z"]
7z = ["sevenz-rust"]

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kglance"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "z"
strip = true
